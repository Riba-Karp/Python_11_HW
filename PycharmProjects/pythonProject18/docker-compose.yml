version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cowork
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: coworking
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  db_data:
